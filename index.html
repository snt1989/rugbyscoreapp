<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ラグビー試合記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: scorer's clipboard. Sticky scoreboard on top, five task tabs pinned at the bottom, entry sheets slide up over the list. Home = blue ink, Away = brick ink, pitch green for controls. */
:root{
  --bg:#EDF0EA; --surface:#FFFFFF; --surface2:#E2E7E0; --fg:#18211B; --muted:#56635B; --line:#C9D1C8;
  --accent:#1D6A49; --on-accent:#FFFFFF;
  --home:#1D4F9F; --home-soft:#DCE6F6; --away:#B23A2A; --away-soft:#F6E0DB; --on-team:#FFFFFF;
  --yellow:#F2C200; --red:#C9302C; --ok:#1D6A49; --warn:#8A5D00; --warn-soft:#F7ECCB;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#182019; --surface2:#222D25; --fg:#E6EDE7; --muted:#96A69B; --line:#2F3D34;
  --accent:#4CC38A; --on-accent:#07140D;
  --home:#86AEF2; --home-soft:#1B2A45; --away:#F28E76; --away-soft:#41211B; --on-team:#0C1410;
  --yellow:#F2C200; --red:#E0524D; --ok:#4CC38A; --warn:#E6B54A; --warn-soft:#3A2F12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#182019; --surface2:#222D25; --fg:#E6EDE7; --muted:#96A69B; --line:#2F3D34;
  --accent:#4CC38A; --on-accent:#07140D;
  --home:#86AEF2; --home-soft:#1B2A45; --away:#F28E76; --away-soft:#41211B; --on-team:#0C1410;
  --yellow:#F2C200; --red:#E0524D; --ok:#4CC38A; --warn:#E6B54A; --warn-soft:#3A2F12;
  color-scheme:dark}
body{background:var(--bg);color:var(--fg)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2{font-size:17px;margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--muted);font-size:12px}
.hint{font-size:12.5px;color:var(--muted)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sp{flex:1}
.t-h{--tc:var(--home);--ts:var(--home-soft)}
.t-a{--tc:var(--away);--ts:var(--away-soft)}

/* scoreboard */
#head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hin{max-width:720px;margin:0 auto;padding:8px 16px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4px 10px;align-items:center}
.hsc{min-width:0;color:var(--tc)}
.hsc.r{text-align:right}
.hn{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--fg);min-width:0}
.hsc.r .hn{justify-content:flex-end}
.bignum{display:block;font:700 46px/1 var(--f-num);font-variant-numeric:tabular-nums}
.hclk{display:grid;justify-items:center;padding:3px 12px;border-radius:10px;background:var(--surface2)}
.hclk .hl{font-size:11px;color:var(--muted)}
#clk{font:600 26px/1.05 var(--f-num);font-variant-numeric:tabular-nums}
.hctl{grid-column:1/-1;display:flex;gap:8px;align-items:center;justify-content:space-between}
.chip{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;background:var(--tc);color:var(--on-team);font:700 12px var(--f-num);font-style:normal;flex:none}

/* controls */
.btn{min-height:48px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.4}
.btn svg{width:18px;height:18px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg.wrap{flex-wrap:wrap;border:0;gap:6px;background:none;overflow:visible}
.seg.big{display:flex}
.seg.big .sg{flex:1;min-height:46px}
.sg{min-height:40px;padding:0 12px;font-weight:700}
.seg.wrap .sg{border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.sg[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.seg.wrap .sg[aria-pressed=true]{border-color:var(--accent)}
.sg.t-h[aria-pressed=true],.sg.t-a[aria-pressed=true]{background:var(--tc);color:var(--on-team);border-color:var(--tc)}

/* layout */
.page{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:12px calc(92px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;min-width:0}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph h2{margin-right:auto}
.note{background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.note p{flex:1;min-width:180px}
.teams2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tp{border:1.5px solid var(--tc);padding:10px;gap:8px}
.tph{display:flex;gap:6px;align-items:center;color:var(--tc);font-weight:700;min-width:0}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sbtn{min-height:62px;padding:6px 8px;border-radius:10px;border:1.5px solid var(--tc);background:var(--ts);color:var(--tc);display:grid;grid-template-columns:1fr auto;align-content:center;align-items:baseline;text-align:left}
.sbtn .code{font:700 26px/1 var(--f-num)}
.sbtn .pt{font:600 13px var(--f-num)}
.sbtn .nm{grid-column:1/-1;font-size:10.5px;line-height:1.25;color:var(--muted)}
.sbtn.strong{background:var(--tc);color:var(--on-team)}
.sbtn.strong .nm{color:inherit;opacity:.9}
.sbtn.miss{background:transparent;border-style:dashed}
.sbtn:active{transform:scale(.97)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fteam{display:grid;gap:6px}
.fteam>b{color:var(--tc);font-size:13px}
.frow{display:grid;grid-template-columns:26px 40px 1fr 40px;align-items:center;gap:4px}
.frow span{font:700 15px var(--f-num);color:var(--muted)}
.frow output{font:700 26px/1 var(--f-num);text-align:center;font-variant-numeric:tabular-nums}
.sq{min-height:40px;border:1.5px solid var(--line);border-radius:10px;font-weight:700;font-size:20px;background:var(--surface)}
.sq.add{border-color:var(--tc);color:var(--tc)}

/* lists */
.row{display:grid;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 4px;border-top:1px solid var(--line);min-height:52px}
.ev{grid-template-columns:54px minmax(0,1fr) 44px 66px}
.tm{font:600 13px var(--f-num);color:var(--muted);white-space:nowrap}
.tm b{font-size:22px;color:var(--fg)}
.who{display:flex;gap:6px;align-items:center;min-width:0}
.code{font:700 20px var(--f-num);color:var(--tc)}
.code.miss{opacity:.55}
.rs{justify-self:end;font:600 21px var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.rs .h{color:var(--home)} .rs .a{color:var(--away)}
.cr{grid-template-columns:54px minmax(0,1fr)}
.cr .l1{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:700}
.cr .l2{display:block;font-size:13.5px;overflow-wrap:anywhere}
.cr .l3{display:block;font-size:12px;color:var(--muted)}
.conc{font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.cardi{display:inline-block;width:14px;height:20px;border-radius:2px;flex:none}
.cardi.y{background:var(--yellow)} .cardi.r{background:var(--red)}
.empty{padding:14px 6px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center;font-size:13.5px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* forms */
.f{display:grid;gap:4px;min-width:0}
.lb{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em}
input:not([type=checkbox]),textarea{width:100%;min-height:44px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px;min-width:0}
textarea{min-height:92px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.mrow{display:grid;grid-template-columns:40px minmax(0,1fr) 46px 38px 38px;gap:6px;align-items:center}
.mrow input{padding:6px 8px}
.mrow input.gr{padding:6px 2px;text-align:center}
.no{display:grid;justify-items:center;line-height:1.1}
.no b{font:700 21px var(--f-num)}
.no small{font-size:9.5px;color:var(--muted)}
.tg{min-height:38px;border:1.5px solid var(--line);border-radius:8px;font-weight:700;font-size:12px;background:var(--surface)}
.tg[aria-pressed=true]{background:var(--tc);color:var(--on-team);border-color:var(--tc)}
.mhead{display:grid;grid-template-columns:40px minmax(0,1fr) 46px 38px 38px;gap:6px;font-size:11px;color:var(--muted);font-weight:700;text-align:center}

/* summary */
.res .line{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;flex-wrap:wrap}
.res .line b{font:700 44px/1 var(--f-num);font-variant-numeric:tabular-nums}
.res .line .t-h,.res .line .t-a{color:var(--tc)}
.ox{overflow-x:auto}
.st{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;text-align:center}
.st th,.st td{border:1px solid var(--line);padding:6px 4px}
.st thead th{background:var(--surface2)}
.st tbody th{text-align:left;padding-left:8px;background:var(--surface2);width:22%}
.st th.t-h,.st th.t-a{color:var(--tc)}
.st .tot td{font:700 24px var(--f-num)}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok);color:var(--on-accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.ckr{display:flex;align-items:center;gap:10px;min-height:44px;text-align:left;border-top:1px solid var(--line);width:100%;padding:4px 2px}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.dot.ok{background:var(--ok);color:var(--on-accent)}
.dot.no{border:2px solid var(--warn)}
.cb{display:flex;gap:8px;align-items:center}
.cb code{flex:1;min-width:0;overflow-wrap:anywhere;padding:8px 10px;background:var(--surface2);border-radius:8px;font:13.5px/1.4 var(--f-body)}
.sig{display:grid;gap:6px}
.sig canvas{width:100%;height:110px;border:1.5px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;display:block}
.sig .top{display:flex;align-items:center;justify-content:space-between}

/* nav, sheet, toast */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{display:grid;justify-items:center;gap:2px;padding:8px 2px 7px;font-size:11px;font-weight:700;color:var(--muted);border-top:3px solid transparent;margin-top:-1px}
#nav button[aria-current=page]{color:var(--accent);border-top-color:var(--accent)}
#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#ov{position:fixed;inset:0;z-index:50}
.bd{position:absolute;inset:0;background:rgba(10,16,12,.55)}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,560px);max-height:90%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px 0;display:grid;gap:14px;align-content:start;outline:none;animation:up .18s ease-out}
@keyframes up{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.actions{position:sticky;bottom:0;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.numgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.nb{min-height:56px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1.1;padding:2px;min-width:0}
.nb b{font:700 21px var(--f-num)}
.nb small{font-size:9.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb[aria-pressed=true]{background:var(--tc);border-color:var(--tc);color:var(--on-team)}
.nb[aria-pressed=true] small{color:inherit}
.timerow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px}
.step input{width:76px;text-align:center;font:700 24px var(--f-num)}
.step button{width:44px;height:44px;border:1.5px solid var(--line);border-radius:10px;font-size:22px;background:var(--surface)}
.numin{display:flex;align-items:center;gap:8px}
.numin input{width:84px;text-align:center;font:700 22px var(--f-num)}
.np{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);font-size:14px;flex-wrap:wrap}
#toast button{font-weight:700;color:inherit;text-decoration:underline;padding:6px 4px}

/* beginner-friendly additions */
[hidden]{display:none!important}
.seg.wrap .sg[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg.wrap .sg.t-h[aria-pressed=true],.seg.wrap .sg.t-a[aria-pressed=true]{background:var(--tc);color:var(--on-team);border-color:var(--tc)}
#head .sg{min-height:44px;padding:0 10px}
.hbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;flex:none}
.guide{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:14px;display:grid;gap:10px;justify-items:start}
.guide b{font-size:17px}
.steps{margin:0;padding-left:1.4em;display:grid;gap:6px}
.tblk{display:grid;gap:8px;border:1.5px solid var(--tc);border-radius:14px;background:var(--surface);padding:10px;min-width:0}
.tblk .tph{font-size:16px}
.tryb{min-height:84px;border-radius:12px;background:var(--tc);color:var(--on-team);font-size:22px;font-weight:700;display:grid;place-items:center;align-content:center;line-height:1.25}
.tryb small{font-size:14px;font-weight:400}
.tryb:active,.othb:active{transform:scale(.98)}
.othb{min-height:60px;border-radius:12px;border:1.5px solid var(--tc);color:var(--tc);background:var(--ts);font-weight:700;font-size:15px;line-height:1.3;padding:4px 6px;display:grid;place-items:center;align-content:center}
.othb small{font-size:11.5px;font-weight:400;color:var(--muted)}
.fteam2{display:grid;gap:10px;min-width:0;align-content:start}
.fteam2>b{color:var(--tc);font-size:15px}
.fl{display:block;font-size:12.5px;color:var(--muted);line-height:1.3;margin-bottom:4px}
.fr2{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:6px}
.fr2 output{font:700 32px/1 var(--f-num);text-align:center;font-variant-numeric:tabular-nums}
.sq{min-height:52px}
.ev{grid-template-columns:54px minmax(0,1fr) auto}
.evm{min-width:0;display:grid}
.evm .l1{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);min-width:0}
.evm .l2{font-weight:700;overflow-wrap:anywhere}
.evm .l3{font-size:13.5px;color:var(--muted)}
.warnt{color:var(--warn);font-weight:700;font-style:normal}
.btnrow .lg{flex:1}
.btn.lg{min-height:56px;font-size:17px;width:100%}
.btnrow .btn.lg{width:auto;min-width:140px}
.sh{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding-top:4px}
.sh b{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 16px var(--f-num);flex:none}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:1fr auto;gap:0 10px;text-align:left;padding:10px 12px;min-height:60px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);align-items:center}
.opt .on{font-weight:700;font-size:16px}
.opt .op{font:700 22px var(--f-num);color:var(--tc)}
.opt .od{grid-column:1/-1;font-size:13px;color:var(--muted)}
.opt[aria-pressed=true]{border-color:var(--tc);background:var(--ts);box-shadow:inset 0 0 0 1.5px var(--tc)}
.opt[aria-pressed=true] .od{color:var(--fg)}
.chk{display:flex;gap:12px;align-items:center;min-height:52px}
.chk input{width:26px;height:26px;min-height:0;flex:none}
.sheet h3{margin:4px 0 0;font-size:15px}
.sheet dl{margin:0;display:grid;gap:10px}
.sheet dt{font-weight:700}
.sheet dd{margin:0;color:var(--muted);font-size:14px}
.mrow{grid-template-columns:44px minmax(0,1fr) 46px 44px 40px}
.mrow input{min-height:48px}
.tg{min-height:44px;font-size:12px}

.pvbox{position:relative;overflow:hidden;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:zoom-in;min-height:120px}
.pvpaper{position:absolute;left:0;top:0;width:1414px;transform-origin:0 0;pointer-events:none}
#pv{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.pvbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.pvst{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));touch-action:pan-x pan-y pinch-zoom}
.pvin{position:relative;margin:0 auto;background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.25)}
.rolist{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ror{display:grid;grid-template-columns:34px minmax(0,1fr) 40px 70px;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);font-size:14px}
.ror:first-child{border-top:0}
.ror b{font:700 20px var(--f-num);text-align:center}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:340px){.teams2,.fgrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header id="head"></header>
<main id="main"></main>
<nav id="nav" aria-label="画面切り替え"></nav>
<div id="ov" hidden><div class="bd" data-a="close"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div id="pv" hidden role="dialog" aria-modal="true" aria-label="記録用紙のプレビュー"><div class="pvbar"><button class="btn sm" data-a="pv-close">閉じる</button><button class="btn sm" data-a="pv-z" data-d="-1" aria-label="縮小">−</button><span id="pvz" class="muted"></span><button class="btn sm" data-a="pv-z" data-d="1" aria-label="拡大">＋</button><button class="btn sm" data-a="pv-fit">全体</button></div><div class="pvst" id="pvst"><div class="pvin" id="pvin"></div></div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="jf" accept=".json,application/json" hidden>
<input type="file" id="rf" accept=".csv,.tsv,.txt,text/plain,text/csv" hidden>
<input type="file" id="ri" accept="image/*" hidden>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const KEY='rugby-record-v1',KEYP='rugby-record-prev',KEYT='rugby-record-tab';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};

/* ---------- constants ---------- */
const TY={T:{c:'T',n:'トライ',p:5},G:{c:'G',n:'ゴール',p:2},GX:{c:'G×',n:'ゴール失敗',p:0},PG:{c:'PG',n:'ペナルティゴール',p:3},PGX:{c:'PG×',n:'PG失敗',p:0},DG:{c:'DG',n:'ドロップゴール',p:3},DGX:{c:'DG×',n:'DG失敗',p:0},PT:{c:'PT',n:'ペナルティトライ',p:7}};
const ORDER=['T','G','GX','PG','PGX','DG','DGX','PT'];
const POS=['PR','HO','PR','LO','LO','FL','FL','No.8','SH','SO','WTB','CTB','CTB','WTB','FB'];
const POSJ=['プロップ','フッカー','プロップ','ロック','ロック','フランカー','フランカー','ナンバーエイト','スクラムハーフ','スタンドオフ','ウイング','センター','センター','ウイング','フルバック'];
const KINDS=[['T','トライ',5,'ボールをインゴール(得点エリア)に置いた'],['G','ゴール',2,'トライのあとに蹴るキック'],['PG','ペナルティゴール',3,'反則で得たキックが、ゴールに入った'],['DG','ドロップゴール',3,'プレー中にワンバウンドさせて蹴り、ゴールに入った'],['PT','ペナルティトライ',7,'反則がなければトライだった、とレフリーが認めた']];
const TYN={T:'トライ',G:'ゴール成功',GX:'ゴール失敗',PG:'ペナルティゴール成功',PGX:'ペナルティゴール失敗',DG:'ドロップゴール成功',DGX:'ドロップゴール失敗',PT:'ペナルティトライ'};
const baseOf=t=>String(t).replace(/X$/,'');
const isKick=b=>b==='G'||b==='PG'||b==='DG';
const GROUPS=[['フォワード 1〜8番',0,8],['ハーフ団 9・10番',8,10],['バックス 11〜14番',10,14],['フルバック 15番',14,15],['リザーブ 16〜23番',15,23]];
const TABS=[['info','試合情報','<path d="M6 21V4M6 5h11l-2 4 2 4H6"/>'],['mem','メンバー','<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M17 14.5c2.5 0 4 1.8 4 4.5"/>'],['rec','試合中','<path d="M8 4h8v3H8z"/><path d="M6 6H5v15h14V6h-1"/><path d="M9 12h6M9 16h4"/>'],['chg','交替・カード','<path d="M4 8h14l-3-3M20 16H6l3 3"/>'],['sum','提出','<path d="M21 3 3 10l7 3 3 7z"/><path d="M10 13 21 3"/>']];
const halfL=h=>Number(h)===1?'前半':'後半';

/* ---------- state ---------- */
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function blankRoster(){return Array.from({length:23},()=>({name:'',grade:'',cap:false,fr:false}));}
function blankOff(){return{name:'',aff:'',kind:''};}
function fresh(){return{v:1,seq:1,
  info:{tournament:'東北地区大学ラグビーリーグ',date:today(),ko:'',venue:'',crowd:'',assoc:'',weather:'',ground:'',wind:'',kick1:'',notes:'',loss:''},
  off:{ref:blankOff(),ar1:blankOff(),ar2:blankOff(),ar3:blankOff(),dr:blankOff(),mc:blankOff()},
  scorer:{team:'',name:''},
  teams:{h:{name:''},a:{name:''}},
  roster:{h:blankRoster(),a:blankRoster()},
  events:[],changes:[],cards:[],
  fouls:{h:{1:{pk:0,fk:0},2:{pk:0,fk:0}},a:{1:{pk:0,fk:0},2:{pk:0,fk:0}}},
  pts:{h:'',a:''},sig:{ref:'',mc:''},
  clock:{half:1,acc:{1:0,2:0},start:null}};}
function merge(base,src){
  if(base===null||typeof base!=='object'||Array.isArray(base)) return src===undefined?base:src;
  const out={...base};
  if(src&&typeof src==='object') for(const k of Object.keys(src)) out[k]=(k in base)?merge(base[k],src[k]):src[k];
  return out;}
function load(){const s=ls.get(KEY); if(s){try{return merge(fresh(),JSON.parse(s));}catch(e){}} return fresh();}
let S=load();
let tab=ls.get(KEYT); if(!TABS.some(t=>t[0]===tab)) tab='info';
let mt='h',draft=null,newArm=0,lastRm=null,saveOK=true,saveT=null;
const browserDl={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data],{type:/\.html$/.test(filename)?'text/html':/\.json$/.test(filename)?'application/json':'text/plain'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u);},4000);return{status:'saved'};}};
const caps={dl:browserDl,sm:null,img:null};

function save(){clearTimeout(saveT);saveT=setTimeout(()=>{saveOK=ls.set(KEY,JSON.stringify(S));const b=$('#sv');if(b)b.textContent=saveOK?'この端末に自動保存しています':'自動保存できません。バックアップを保存してください';},200);}
function stash(){ls.set(KEYP,JSON.stringify(S));}
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function setPath(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++)a=a[ks[i]];a[ks[ks.length-1]]=v;}
const tn=t=>(S.teams[t].name||'').trim()||(t==='h'?'ホーム':'アウェイ');
const sn=(t,n)=>{const p=S.roster[t][n-1];return p?String(p.name||'').trim().split(/[\s　]+/)[0]:'';};
const previewName=(t,n)=>n===''||n==null?'':(n<1||n>23?'1〜23':sn(t,n));

/* ---------- scoring ---------- */
function sortedEvents(){return [...S.events].sort((a,b)=>a.half-b.half||a.min-b.min||a.id-b.id);}
function calc(){
  const cnt={h:{1:{},2:{}},a:{1:{},2:{}}},pts={h:{1:0,2:0},a:{1:0,2:0}},run={};let H=0,A=0;
  for(const e of sortedEvents()){const p=TY[e.type].p;cnt[e.team][e.half][e.type]=(cnt[e.team][e.half][e.type]||0)+1;pts[e.team][e.half]+=p;if(e.team==='h')H+=p;else A+=p;run[e.id]=[H,A];}
  return{cnt,pts,run,tot:{h:H,a:A}};}
function tries(c,t){return [1,2].reduce((s,h)=>s+(c.cnt[t][h].T||0)+(c.cnt[t][h].PT||0),0);}
function autoPts(c){const H=c.tot.h,A=c.tot.a;let h=0,a=0;if(H>A)h=4;else if(A>H)a=4;else{h=2;a=2;}
  if(tries(c,'h')>=4)h++;if(tries(c,'a')>=4)a++;if(H<A&&A-H<=7)h++;if(A<H&&H-A<=7)a++;return{h,a};}

/* ---------- clock ---------- */
function halfMs(h){return (S.clock.acc[h]||0)+(S.clock.start&&Number(S.clock.half)===Number(h)?Date.now()-S.clock.start:0);}
const fmt=ms=>{const s=Math.floor(ms/1000);return pad(Math.floor(s/60))+':'+pad(s%60);};
function defMin(){const ms=halfMs(S.clock.half);return ms>0?Math.ceil(ms/60000):'';}
function pauseClock(){if(S.clock.start){S.clock.acc[S.clock.half]=halfMs(S.clock.half);S.clock.start=null;}}
let wl=null;
async function wake(on){try{if(on&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');}else if(wl){await wl.release();wl=null;}}catch(e){}}
setInterval(()=>{const el=$('#clk');if(el)el.textContent=fmt(halfMs(S.clock.half));},250);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.clock.start)wake(true);});

/* ---------- small pieces ---------- */
let toastT=null,toastActs=[];
function toast(msg,acts,ms){const el=$('#toast');toastActs=acts||[];el.innerHTML='<span>'+esc(msg)+'</span>'+toastActs.map((a,i)=>'<button data-a="tact" data-i="'+i+'">'+esc(a.l)+'</button>').join('');el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;},ms||2600);}
async function copy(text,msg){try{await navigator.clipboard.writeText(text);toast(msg||'コピーしました');}catch(e){draft={k:'copy',text};showSheet();}}
function fmtDate(iso){if(!iso)return '';const d=new Date(iso+'T00:00:00');if(isNaN(d))return iso;return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日('+'日月火水木金土'[d.getDay()]+')';}
function subject(){const tm=(S.scorer.team||'').trim()||tn('h');const d=S.info.date?S.info.date.slice(2).replace(/-/g,''):'試合日';return '【'+tm+'】'+d+'試合記録';}
const byTime=(a,b)=>a.half-b.half||a.min-b.min||a.id-b.id;
const isBlank=()=>!S.events.length&&!S.changes.length&&!S.cards.length&&!S.teams.h.name&&!S.teams.a.name&&!S.roster.h.some(p=>p.name)&&!S.roster.a.some(p=>p.name);

/* ---------- header ---------- */
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>',PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';
function renderHead(){
  const c=calc(),run=!!S.clock.start,hm=S.clock.half,started=halfMs(hm)>0;
  $('#head').innerHTML='<div class="hin">'+
   '<div class="hsc t-h"><span class="hn"><i class="chip">H</i><span class="ell">'+esc(tn('h'))+'</span></span><b class="bignum">'+c.tot.h+'</b></div>'+
   '<button class="hclk" data-a="clk-adj" aria-label="時計の時間を合わせる"><span class="hl">'+halfL(hm)+'</span><span id="clk">'+fmt(halfMs(hm))+'</span></button>'+
   '<div class="hsc t-a r"><span class="hn"><span class="ell">'+esc(tn('a'))+'</span><i class="chip">A</i></span><b class="bignum">'+c.tot.a+'</b></div>'+
   '<div class="hctl"><div class="seg"><button class="sg" aria-pressed="'+(hm===1)+'" data-a="half" data-v="1">前半</button><button class="sg" aria-pressed="'+(hm===2)+'" data-a="half" data-v="2">後半</button></div><span class="sp"></span>'+
   '<button class="btn '+(run?'':'primary')+'" data-a="clk">'+(run?PAUSE+'時計を止める':PLAY+(started?'時計を再開':'時計を始める'))+'</button>'+
   '<button class="hbtn" data-a="help" aria-label="使い方と用語の説明">?</button></div></div>';
}

/* ---------- views ---------- */
function fld(label,path,o){o=o||{};const id='f-'+path.replace(/\./g,'-');
  return '<div class="f"><label class="lb" for="'+id+'">'+label+'</label><input id="'+id+'"'+(o.type?' type="'+o.type+'"':'')+(o.mode?' inputmode="'+o.mode+'"':'')+' data-bind="'+path+'" value="'+esc(getPath(S,path))+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+' autocomplete="off"></div>';}
function segF(label,path,opts){const v=getPath(S,path);
  return '<div class="f"><span class="lb">'+label+'</span><div class="seg wrap">'+opts.map(o=>'<button class="sg" aria-pressed="'+(v===o)+'" data-a="set" data-p="'+path+'" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div></div>';}

function evRow(e,c){const r=c.run[e.id],T=TY[e.type];
  const who=e.no?'#'+e.no+' '+esc(sn(e.team,e.no)):'<em class="warnt">背番号なし</em>';
  return '<button class="row ev t-'+e.team+'" data-a="ev-edit" data-id="'+e.id+'"><span class="tm">'+(e.half===1?'前':'後')+'<b>'+e.min+'</b>′</span>'+
   '<span class="evm"><span class="l1"><i class="chip">'+(e.team==='h'?'H':'A')+'</i>'+esc(tn(e.team))+'</span><span class="l2">'+TYN[e.type]+(T.p?' +'+T.p+'点':'')+'</span><span class="l3">'+who+'</span></span>'+
   '<span class="rs"><span class="h">'+r[0]+'</span>–<span class="a">'+r[1]+'</span></span></button>';}

function viewRec(){
  const c=calc(),ev=sortedEvents().reverse(),hm=S.clock.half,idle=!S.clock.start&&halfMs(hm)===0;
  const tb=t=>'<div class="tblk t-'+t+'"><div class="tph"><i class="chip">'+(t==='h'?'H':'A')+'</i><span class="ell">'+esc(tn(t))+'</span></div>'+
    '<button class="tryb" data-a="score" data-t="'+t+'" data-y="T">トライ<small>5点</small></button>'+
    '<button class="othb" data-a="score" data-t="'+t+'" data-y="">ほかの得点<small>キックなど</small></button></div>';
  const foul=t=>{const f=S.fouls[t][hm];return '<div class="fteam2 t-'+t+'"><b class="ell">'+esc(tn(t))+'</b>'+[['pk','ペナルティキック(PK)'],['fk','フリーキック(FK)']].map(a=>'<div><span class="fl">'+a[1]+'</span><div class="fr2"><button class="sq" data-a="foul" data-t="'+t+'" data-k="'+a[0]+'" data-d="-1" aria-label="'+a[1]+'を1つ減らす">−</button><output>'+f[a[0]]+'</output><button class="sq add" data-a="foul" data-t="'+t+'" data-k="'+a[0]+'" data-d="1" aria-label="'+a[1]+'を1つ増やす">＋</button></div></div>').join('')+'</div>';};
  const guide=ev.length?'':'<div class="guide"><b>試合中の使い方</b><ol class="steps"><li>キックオフで、上の「時計を始める」を押します。</li><li>得点が入ったら、点を取ったチームのボタンを押します。</li><li>反則があったら、下の「反則を数える」で＋を押します。</li></ol><button class="btn sm" data-a="help">用語の説明を見る</button></div>';
  const clk=(ev.length&&idle)?'<div class="note"><p>'+halfL(hm)+'のキックオフで「時計を始める」を押すと、時間が自動で入ります。</p></div>':'';
  const setup=(!S.teams.h.name&&!S.teams.a.name)?'<div class="note"><p>チーム名とメンバーを入れておくと、得点に選手名が出ます。</p><button class="btn sm" data-a="tab" data-v="mem">メンバーを入力</button></div>':'';
  const empty='<div class="empty"><p><b>得点はまだありません。</b></p><p>得点が入ったら、上のチームのボタンを押してください。</p>'+(isBlank()?'<button class="btn sm" data-a="sample">見本の試合を入れて試す</button>':'')+'</div>';
  return '<section class="page">'+guide+setup+clk+'<div class="teams2">'+tb('h')+tb('a')+'</div>'+
   '<div class="panel"><div class="ph"><h2>得点の記録</h2><button class="btn sm" data-a="undo"'+(ev.length?'':' disabled')+'>直前を取り消す</button></div><div>'+(ev.length?ev.map(e=>evRow(e,c)).join(''):empty)+'</div>'+(ev.length?'<p class="hint">まちがえたときは、行を押すと直せます。</p>':'')+'</div>'+
   '<div class="panel"><div class="ph"><h2>反則を数える('+halfL(hm)+')</h2></div><p class="hint">レフリーが反則を取ったら、そのチームの＋を押します。</p><div class="fgrid">'+foul('h')+foul('a')+'</div></div></section>';
}

function chgRow(x){
  const nm=n=>n?'#'+n+(sn(x.team,n)?' '+esc(sn(x.team,n)):''):'—';
  const kd={sub:'交替',swap:'入替',temp:'一時的退場'}[x.kind];
  let l2=nm(x.out)+' → '+nm(x.in),l3='';
  if(x.kind==='temp'){const r=x.reason==='その他'?(x.rtext||'その他'):x.reason;l3=esc(r||'')+(x.rmin!==''&&x.rmin!=null?' ・ 復帰 '+(Number(x.rhalf)===1?'前':'後')+x.rmin+'′':' ・ 復帰の時間なし');}
  return '<button class="row cr t-'+x.team+'" data-a="chg-edit" data-id="'+x.id+'"><span class="tm">'+(x.half===1?'前':'後')+'<b>'+x.min+'</b>′</span><span><span class="l1"><i class="chip">'+(x.team==='h'?'H':'A')+'</i>'+esc(tn(x.team))+' '+kd+(x.conc?'<span class="conc">脳振盪 ×</span>':'')+'</span><span class="l2">'+l2+'</span>'+(l3?'<span class="l3">'+l3+'</span>':'')+'</span></button>';}
function cardRow(x){
  const ret=x.color==='y'?'<span class="l3">10分間の退場 → '+(Number(x.half)===1?'前':'後')+(x.min+10)+'′ に復帰</span>':'';
  return '<button class="row cr t-'+x.team+'" data-a="card-edit" data-id="'+x.id+'"><span class="tm">'+(x.half===1?'前':'後')+'<b>'+x.min+'</b>′</span><span><span class="l1"><i class="chip">'+(x.team==='h'?'H':'A')+'</i><i class="cardi '+x.color+'"></i>'+esc(tn(x.team))+' '+(x.color==='y'?'イエロー':'レッド')+'</span><span class="l2">#'+x.no+(sn(x.team,x.no)?' '+esc(sn(x.team,x.no)):'')+(x.text?' ・ '+esc(x.text):'')+'</span>'+ret+'</span></button>';}
function viewChg(){
  const ch=[...S.changes].sort(byTime),cd=[...S.cards].sort(byTime);
  return '<section class="page"><div class="panel"><div class="ph"><h2>選手の入れ替え</h2></div><p class="hint">選手が入れ替わったときに記録します。けがで替わるのが「交替」、作戦で替わるのが「入替」です。出血などで一時的に出る場合は「一時的退場」を使います。</p><div class="btnrow"><button class="btn primary lg" data-a="chg-add" data-k="sub">＋ 交替・入替</button><button class="btn lg" data-a="chg-add" data-k="temp">＋ 一時的退場</button></div>'+
   (ch.length?'<div>'+ch.map(chgRow).join('')+'</div>':'<p class="empty">まだ記録はありません。</p>')+
   '<p class="hint">一時的に替わったあとで、正式な交替になったときは「交替・入替」を追加します(例: 16番 → 2番)。</p></div>'+
   '<div class="panel"><div class="ph"><h2>カード</h2></div><p class="hint">レフリーがカードを出したときに記録します。</p><div class="btnrow"><button class="btn lg" data-a="card-add" data-c="y"><i class="cardi y"></i>イエロー</button><button class="btn lg" data-a="card-add" data-c="r"><i class="cardi r"></i>レッド</button></div>'+
   (cd.length?'<div>'+cd.map(cardRow).join('')+'</div>':'<p class="empty">まだ記録はありません。</p>')+'</div></section>';
}

function nextBtn(v,label){return '<button class="btn primary lg" data-a="tab" data-v="'+v+'">'+label+'</button>';}
function viewMem(){
  const t=mt,r=S.roster[t];
  const row=i=>{const p=r[i],n=i+1;return '<div class="mrow"><div class="no"><b>'+n+'</b><small>'+(POS[i]||'控え')+'</small></div>'+
   '<input data-bind="roster.'+t+'.'+i+'.name" placeholder="'+esc(POSJ[i]||'リザーブ')+'" autocomplete="off" value="'+esc(p.name)+'" aria-label="'+n+'番 氏名">'+
   '<input class="gr" data-bind="roster.'+t+'.'+i+'.grade" inputmode="numeric" maxlength="2" placeholder="学年" autocomplete="off" value="'+esc(p.grade)+'" aria-label="'+n+'番 学年">'+
   '<button class="tg" data-a="cap" data-i="'+i+'" aria-pressed="'+p.cap+'" aria-label="'+n+'番 ゲームキャプテン">主将</button>'+
   '<button class="tg" data-a="fr" data-i="'+i+'" aria-pressed="'+p.fr+'" aria-label="'+n+'番 フロントロー適合">FR</button></div>';};
  return '<section class="page t-'+t+'"><div class="seg big">'+['h','a'].map(x=>'<button class="sg t-'+x+'" aria-pressed="'+(mt===x)+'" data-a="mt" data-v="'+x+'">'+esc(tn(x))+'</button>').join('')+'</div>'+
   fld('チーム名','teams.'+t+'.name')+
   '<button class="btn lg" data-a="ro-open">メンバー表から読み取る</button><div class="note"><p>氏名は「苗字 名前」の順に入れます。得点の記録には苗字だけが出ます。学年は数字だけで大丈夫です。<br><b>主将</b>はゲームキャプテン、<b>FR</b>はフロントロー(1・2・3番)ができる選手に付けます。わからなければ空欄で構いません。</p></div>'+
   GROUPS.map(g=>'<div class="panel"><div class="ph"><h2>'+g[0]+'</h2></div>'+Array.from({length:g[2]-g[1]},(_,k)=>row(g[1]+k)).join('')+'</div>').join('')+
   (mt==='h'?'<button class="btn lg" data-a="mt" data-v="a">次へ: '+esc(tn('a'))+' のメンバーを入力</button>':nextBtn('rec','次へ: 試合の記録をはじめる'))+'</section>';
}

function offRow(label,key,mode){
  const o=S.off[key];let second='',kind='';
  if(mode==='ref')second='<input data-bind="info.assoc" placeholder="協会名(例: 東北)" autocomplete="off" value="'+esc(S.info.assoc)+'" aria-label="'+label+' 協会名">';

/* ---------- signature pads ---------- */
function initPads(){['ref','mc'].forEach(k=>{
  const cv=$('#pad-'+k);if(!cv)return;
  const dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;
  cv.width=Math.max(1,w*dpr);cv.height=Math.max(1,h*dpr);
  const g=cv.getContext('2d');g.scale(dpr,dpr);g.fillStyle='#fff';g.fillRect(0,0,w,h);g.lineWidth=2.4;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#111';
  if(S.sig[k]){const im=new Image();im.onload=()=>g.drawImage(im,0,0,w,h);im.src=S.sig[k];}
  let dr=false,moved=false,lx=0,ly=0;
  const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
  cv.addEventListener('pointerdown',e=>{dr=true;moved=false;try{cv.setPointerCapture(e.pointerId);}catch(x){}[lx,ly]=pt(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(!dr)return;const[x,y]=pt(e);g.beginPath();g.moveTo(lx,ly);g.lineTo(x,y);g.stroke();lx=x;ly=y;moved=true;});
  const end=()=>{if(!dr)return;dr=false;if(moved){S.sig[k]=cv.toDataURL('image/png');save();refreshChecks();}};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
});}
function refreshChecks(){if(tab==='sum'){const y=window.scrollY;render();window.scrollTo(0,y);}}

   '天候: '+(I.weather||'-')+' / グラウンド: '+(I.ground||'-')+' / 風: '+(I.wind||'-'),
   'レフリー: '+S.off.ref.name,'記録係: '+S.scorer.team+' '+S.scorer.name,'',
   tn('h')+' '+c.tot.h+' - '+c.tot.a+' '+tn('a')+'  (前半 '+c.pts.h[1]+'-'+c.pts.a[1]+' / 後半 '+c.pts.h[2]+'-'+c.pts.a[2]+')');
  ['h','a'].forEach(t=>L.push(tn(t)+': T'+(c.cnt[t][1].T||0)+'+'+(c.cnt[t][2].T||0)+' G'+(c.cnt[t][1].G||0)+'+'+(c.cnt[t][2].G||0)+' PT'+((c.cnt[t][1].PT||0)+(c.cnt[t][2].PT||0))+' PG'+((c.cnt[t][1].PG||0)+(c.cnt[t][2].PG||0))+' DG'+((c.cnt[t][1].DG||0)+(c.cnt[t][2].DG||0))+'  反則 PK'+(S.fouls[t][1].pk+S.fouls[t][2].pk)+' FK'+(S.fouls[t][1].fk+S.fouls[t][2].fk)+(S.pts[t]!==''?'  勝ち点 '+S.pts[t]:'')));
  L.push('','■得点経過');
  sortedEvents().forEach(e=>{const r=c.run[e.id];L.push(halfL(e.half)+e.min+'分 '+tn(e.team)+' '+(e.no?e.no+'/'+sn(e.team,e.no)+' ':'')+TY[e.type].c+'  '+r[0]+'-'+r[1]);});
  if(S.changes.length){L.push('','■交替・入替・一時的退場');[...S.changes].sort(byTime).forEach(x=>{L.push(halfL(x.half)+x.min+'分 '+tn(x.team)+' '+{sub:'交替',swap:'入替',temp:'一時的退場'}[x.kind]+' '+x.out+'→'+(x.in||'-')+(x.conc?' 脳振盪×':'')+(x.kind==='temp'?' '+(x.reason==='その他'?x.rtext:x.reason)+(x.rmin!==''&&x.rmin!=null?' 復帰'+halfL(x.rhalf)+x.rmin+'分':''):''));});}
  if(S.cards.length){L.push('','■カード');[...S.cards].sort(byTime).forEach(x=>{L.push(halfL(x.half)+x.min+'分 '+tn(x.team)+' '+(x.color==='y'?'イエロー':'レッド')+' '+x.no+(sn(x.team,x.no)?'/'+sn(x.team,x.no):'')+' '+(x.text||''));});}
  ['h','a'].forEach(t=>{L.push('','■'+tn(t)+' メンバー');S.roster[t].forEach((p,i)=>{if(p.name)L.push((i+1)+' '+p.name+(p.grade?'('+p.grade+')':'')+(p.cap?' 主将':'')+(p.fr?' FR':''));});});
  if(I.notes)L.push('','■特記事項',I.notes);
  return L.join('\n');}

function pvRender(keep){const sh=sheet(),st=$('#pvst'),inn=$('#pvin');let cx=.5,cy=0;

function pdfBlob(jpeg,iw,ih){const enc=new TextEncoder(),W=841.89,Hh=1190.55;let w=W,h=W*ih/iw;if(h>Hh){h=Hh;w=Hh*iw/ih;}
  const chunks=[],offs=[];let len=0;const push=u=>{chunks.push(u);len+=u.length;},str=t=>push(enc.encode(t));
  str('%PDF-1.4\n');
  offs[1]=len;str('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offs[2]=len;str('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  offs[3]=len;str('3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+Hh+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n');
  offs[4]=len;str('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+iw+' /Height '+ih+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpeg.length+' >>\nstream\n');push(jpeg);str('\nendstream\nendobj\n');
  const cs='q '+w.toFixed(2)+' 0 0 '+h.toFixed(2)+' '+((W-w)/2).toFixed(2)+' '+(Hh-h).toFixed(2)+' cm /Im0 Do Q';
  offs[5]=len;str('5 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
  const xr=len;let xs='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<=5;i++)xs+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  str(xs+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(chunks,{type:'application/pdf'});}
function rasterize(sh,scale){return new Promise((res,rej)=>{
  const tmp=document.createElement('div');tmp.innerHTML=sh.html;
  const xml=new XMLSerializer().serializeToString(tmp.firstElementChild);
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+PW+'" height="'+sh.height+'"><foreignObject x="0" y="0" width="'+PW+'" height="'+sh.height+'"><style xmlns="http://www.w3.org/1999/xhtml">'+SHEET_CSS+'</style>'+xml+'</foreignObject></svg>';
  const img=new Image();
  img.onload=()=>{try{const cv=document.createElement('canvas');cv.width=Math.round(PW*scale);cv.height=Math.round(sh.height*scale);const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.scale(scale,scale);g.drawImage(img,0,0,PW,sh.height);res(cv);}catch(e){rej(e);}};
  img.onerror=()=>rej(new Error('render'));
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});}

/* ---------- メンバー表の読み取り ---------- */
const POSW=/^(PR|HO|LO|FL|NO\.?8|SH|SO|WTB|CTB|FB|RE|FW|HB|TB|プロップ|フッカー|ロック|フランカー|ナンバーエイト|スクラムハーフ|スタンドオフ|ウイング|センター|フルバック|リザーブ|控え)$/i;
function parseRoster(text){
  const rows=[],skipped=[];let next=1;
  String(text||'').normalize('NFKC').split(/\r?\n/).forEach(raw=>{
    const line=raw.trim();if(!line)return;
    if(/(氏名|選手名|背番号)/.test(line)&&!/\d/.test(line))return;
    const cells=(line.includes('\t')?line.split('\t'):/[,、，]/.test(line)?line.split(/[,、，]/):line.split(/\s+/)).map(c=>c.trim()).filter(Boolean);
    let no=null,grade='',fr=false,cap=false;const np=[];
    cells.forEach((c,i)=>{let m;
      if(/^[○〇◯]$/.test(c)){fr=true;return;}
      if(/^(◎|主将|キャプテン|主|GC|C|\(C\)|CAP)$/i.test(c)){cap=true;return;}
      if(POSW.test(c))return;
      if(no===null&&i===0&&(m=/^(\d{1,2})番?$/.exec(c))){no=+m[1];return;}
      if(np.length>0&&(m=/^([1-6])年?生?$/.exec(c))){grade=m[1];return;}
      if(/^\d+$/.test(c)){if(no===null&&np.length===0)no=+c;return;}
      np.push(c);});
    let name=np.join(' ').replace(/[\(](主将|C|キャプテン|GC)[\)]/i,()=>{cap=true;return '';}).trim();
    const gm=/[\(]([1-6])[\)]$/.exec(name);if(gm){grade=gm[1];name=name.replace(gm[0],'').trim();}
    if(!name&&no===null)return;
    if(no===null)no=next;
    if(no<1||no>23){skipped.push(raw.trim());return;}
    next=no+1;rows.push({no,name,grade,fr,cap});});
  return{rows,skipped};}
const ROSTER_PROMPT='添付の画像は、ラグビーの試合のメンバー表です(選手名簿、または記録用紙のメンバー欄)。背番号1〜23の選手を読み取り、JSONだけで返してください。\nチームが1つだけ写っていても、ホーム(左)とアウェイ(右)の2チームが写っていても、次の形式で、写っているチームの数だけ入れてください。\n{"teams":[{"side":"home か away か unknown","team":"チーム名(書かれていれば。なければ空文字)","players":[{"no":背番号(数字),"name":"苗字 名前","grade":"学年(数字だけ。なければ空文字)","fr":フロントロー適合の○が付いていればtrue,"cap":ゲームキャプテンの印(背番号を丸で囲むなど)があればtrue}]}]}\n記録用紙では、左の表がHome、右の表がAwayです。読めない文字は推測せず、その項目を空にしてください。画像にない選手を作らないでください。苗字と名前の間は半角スペース1つにしてください。画像が複数あるときは、すべてをまとめて読み取ってください。';
let roCtl=null;
function roShrink(f){return new Promise((ok,ng)=>{const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const k=Math.min(1,2000/Math.max(im.naturalWidth,im.naturalHeight)),cv=document.createElement('canvas');cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);
    const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);ok(cv.toDataURL('image/jpeg',0.85).split(',')[1]);};
  im.onerror=()=>{URL.revokeObjectURL(u);ng({code:'image_rejected'});};im.src=u;});}
function roPass(v){try{if(v===undefined)return localStorage.getItem('rugby-record-pass')||'';if(v)localStorage.setItem('rugby-record-pass',v);else localStorage.removeItem('rugby-record-pass');}catch(e){}return '';}
async function roApi(files,signal){const imgs=[];for(const f of files)imgs.push({data:await roShrink(f)});
  let r;try{r=await fetch('/api/roster',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({images:imgs,pass:roPass()}),signal});}
  catch(x){if(x&&x.name==='AbortError')throw{code:'cancelled'};throw{code:'no_backend'};}
  let j=null;try{j=await r.json();}catch(x){}
  if(!r.ok||!j||!j.result)if(r.status===502||r.status===500)throw{code:'upstream',msg:'HTTP '+r.status+((j&&j.status)?' / API '+j.status:'')+((j&&j.detail)?' / '+j.detail:'')};
  if(!r.ok||!j||!j.result)throw{code:(r.status===401)?'bad_pass':(j&&j.error==='no_api_key')?'no_api_key':(j&&j.error==='rate_limited')?'rate_limited':(j&&j.error==='invalid_json')?'invalid_json':(r.status===404||r.status===405)?'no_backend':'server'};
  return j.result;}
function roErr(e){const c=e&&e.code;
  if(c==='upstream')return '読み取りに失敗しました。原因: '+(e.msg||'')+'(この文をそのまま伝えてください)';
  if(c==='no_api_key')return 'このページでは、画像読み取りの設定(APIキー)がまだ入っていません。管理者に連絡するか、表を貼り付けてください。';
  if(c==='no_backend')return 'この場所では、画像の読み取りが使えません。表を貼り付けてください。';
  if(c==='cancelled')return '';
  if(c==='not_granted'||c==='sampling_disabled'||c==='images_unavailable'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared')return 'この画面では、画像を読み取れません。表をコピーして貼り付けてください。';
  if(c==='image_rejected')return 'この画像は読み込めません。JPEGかPNGの、別の画像を選んでください。';
  if(c==='rate_limited')return '利用の上限に達しています。しばらくしてから、もう一度試してください。';
  if(c==='session_expired')return 'ログインの有効期限が切れました。ページを開き直してください。';
  if(c==='invalid_json'||c==='empty_completion'||c==='refused')return 'うまく読み取れませんでした。まっすぐ・明るく撮った画像で試すか、表を貼り付けてください。';
  return '読み取れませんでした。もう一度試すか、表を貼り付けてください。';}
function roGroupsFrom(res){
  const ts=Array.isArray(res)?[{players:res}]:(res&&Array.isArray(res.teams)?res.teams:(res&&Array.isArray(res.players)?[res]:[]));
  const skipped=[];
  let gs=ts.map(t=>{const rows=[];(Array.isArray(t&&t.players)?t.players:[]).forEach(x=>{const no=Number(x&&x.no);
      if(!Number.isInteger(no)||no<1||no>23){skipped.push(String(x&&x.no));return;}
      rows.push({no,name:String((x&&x.name)||'').normalize('NFKC').trim(),grade:String((x&&x.grade)||'').normalize('NFKC').replace(/[^\d]/g,'').slice(0,2),fr:!!(x&&x.fr),cap:!!(x&&x.cap)});});
    return{side:String((t&&t.side)||''),tname:String((t&&t.team)||'').trim(),rows};}).filter(g=>g.rows.length);
  if(gs.length===1)gs[0].team=draft.team;
  else if(gs.length>=2){gs=gs.slice(0,2);if(/away/i.test(gs[0].side)&&!/away/i.test(gs[1].side))gs.reverse();gs[0].team='h';gs[1].team='a';}
  gs.forEach(g=>{g.useName=!!g.tname&&!S.teams[g.team].name;});
  return{gs,skipped};}

  let h='<h2>メンバー表から読み取る</h2>';

  if(!gs)h+='<div class="f"><span class="lb">どのチームに入れますか(1チーム分のとき)</span>'+teamSeg()+'</div>';
  if(d.err)h+='<div class="warnbox">'+esc(d.err)+'</div>';

  if(gs){
    const n=gs.reduce((p,g)=>p+g.rows.length,0);
    h+='<p class="hint">読み取り結果を確認してください。'+n+'人分が見つかりました。読み取れた背番号だけを入れ替えます。ほかの番号は、そのままです。'+(gs.length===1?'':'ホームとアウェイの両方を入れます。')+'</p>';
    if(d.skipped&&d.skipped.length)h+='<div class="warnbox">背番号が1〜23でない行は、入れていません('+d.skipped.length+'行)。</div>';
    gs.forEach((g,gi)=>{h+=(gs.length>1||gs[0].team!==mt?'<div class="ph"><h2>'+esc(tn(g.team))+' に入れる</h2></div>':'')+'<div class="rolist">'+g.rows.map(x=>'<div class="ror"><b>'+x.no+'</b><span class="ell">'+(x.name?esc(x.name):'<em class="warnt">氏名なし</em>')+'</span><span>'+(x.grade!==''?esc(x.grade)+'年':'')+'</span><span>'+(x.cap?'主将 ':'')+(x.fr?'FR':'')+'</span></div>').join('')+'</div>'+
      (g.tname?'<label class="chk"><input type="checkbox" id="ro-un-'+gi+'" data-bind="d.groups.'+gi+'.useName"'+(g.useName?' checked':'')+'><span>チーム名を「'+esc(g.tname)+'」にする</span></label>':'');});
    return h+'<div class="actions"><button class="btn" data-a="ro-again">やり直す</button><span class="sp"></span><button class="btn primary" data-a="ro-apply">この内容で入れる</button></div>';}
  h+=stp(1,'写真・画像から読み取る')+'<button class="btn primary lg" data-a="ro-img">写真・画像を選ぶ</button>'+
   '<p class="hint">メンバー表の写真やスクリーンショットを、Claudeが読み取ります。記録用紙のように、ホームとアウェイの2チームが写っていれば、両方を一度に読み取ります。スクリーンショットは、この画面に貼り付ける(Ctrl+V)か、ドラッグしても読み込めます。PDFは、画像にしてから選んでください。まっすぐ・明るく撮ると読み取りやすくなります。'+(caps.sm?'はじめて使うときに、許可の確認が出ます。':'')+'</p>'+
   stp(2,'表をコピーして貼り付ける')+'<textarea id="ro-text" data-bind="d.text" rows="6" placeholder="1  佐藤 太郎  4&#10;2  鈴木 健太  3&#10;3  高橋 翔  3">'+esc(d.text)+'</textarea>'+
   '<p class="hint">ExcelやGoogleスプレッドシートで、背番号・氏名・学年の列を選んでコピーし、貼り付けます。列の順番が違っていても大丈夫です。背番号がないときは、上から1番、2番…と入れます。</p><div class="btnrow"><button class="btn lg" data-a="ro-parse">読み取る</button><button class="btn lg" data-a="ro-file">CSV・テキストを選ぶ</button></div>';
  return h+'<div class="actions"><span class="sp"></span><button class="btn" data-a="close">やめる</button></div>';}
function roFinish(d,gs,skipped){d.busy=false;d.groups=gs.length?gs:null;d.skipped=skipped||[];d.err=gs.length?'':'表の中に、選手が見つかりませんでした。';if(draft===d)renderSheet();}
async function roImages(files){if(!files.length||!draft||draft.k!=='roster')return;
  const d=draft;d.busy=true;d.err='';renderSheet();roCtl=new AbortController();
  try{let res;
    if(caps.sm&&caps.img){const max=caps.img.maxCount||1,use=files.slice(0,max);
      res=await caps.sm.json(ROSTER_PROMPT,{images:use.length===1?use[0]:use,signal:roCtl.signal});}
    else res=await roApi(files.slice(0,3),roCtl.signal);
    const r=roGroupsFrom(res);if(draft!==d)return;roFinish(d,r.gs,r.skipped);}
  catch(x){d.busy=false;if(x&&x.code==='bad_pass'){d.needPass=true;d.files=files;d.err=roPass()?'パスコードが違います。':'この機能を使うには、パスコードが必要です。';}else d.err=roErr(x);if(draft===d)renderSheet();}

function roText(f){if(!f||!draft||draft.k!=='roster')return;const d=draft,fr=new FileReader();
  fr.onload=()=>{if(draft!==d)return;const buf=fr.result;let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(x){try{txt=new TextDecoder('shift_jis').decode(buf);}catch(y){txt=new TextDecoder().decode(buf);}}
    d.text=txt;const r=parseRoster(txt);roFinish(d,r.rows.length?[{team:d.team,tname:'',useName:false,rows:r.rows}]:[],r.skipped);};
  fr.readAsArrayBuffer(f);}
